name: Feature request
description: Propose a new capability or contract extension
title: "feat(scope): "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the API. Features that change the JSON
        schema or CLI contract need a compatibility and migration note.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph describing the missing capability.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and context
      description: What can you not do today? Include commands, JSON snippets, or TUI steps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: CLI flags, JSON fields, types, null semantics, ordering, and compatibility. A minimal example is ideal.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One verifiable checkbox per line.
      value: |
        - [ ] ...
        - [ ] ...
        - [ ] Tests and documentation updated
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What should this change deliberately not do?
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Source paths, related issues, prior art, or measurements.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I described the user-visible behaviour, not only an implementation.
          required: true
